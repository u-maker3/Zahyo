<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>耳座標取り</title><style>*{box-sizing:border-box}body{margin:0;background:#fff4ef;font-family:-apple-system,sans-serif;text-align:center;color:#3e3330}.w{max-width:560px;margin:auto;padding:14px}button{border:0;border-radius:14px;padding:11px 16px;margin:4px;font-weight:800;background:#8b5870;color:white}.off{background:#e7dce1;color:#594750}.ear{position:relative;width:min(94vw,500px);margin:auto;background:white;border-radius:18px;overflow:hidden}.ear img{display:block;width:100%}.dot{position:absolute;width:22px;height:22px;border:4px solid white;border-radius:50%;background:#e94f5f;transform:translate(-50%,-50%);display:none;pointer-events:none}.result{position:sticky;bottom:8px;background:white;border-radius:18px;padding:12px;margin-top:10px;box-shadow:0 4px 18px #0002}.xy{font-size:27px;font-weight:900}.small{font-size:12px;color:#786965}</style></head><body><div class=w><h2>👂 耳画像 座標取り</h2><div><button id=f>表耳</button><button id=b class=off>裏耳</button></div><div class=ear id=ear><img id=img src="ear_base.PNG"><span id=dot class=dot></span></div><div class=result><div class=small>耳画像をタップ👇</div><div id=xy class=xy>X --.- / Y --.-</div><button id=copy>📋 座標コピー</button><div id=msg class=small></div></div></div><script>let last="";function side(back){img.src=back?"ear_back.PNG":"ear_base.PNG";f.className=back?"off":"";b.className=back?"":"off";dot.style.display="none";xy.textContent="X --.- / Y --.-";last=""}f.onclick=()=>side(false);b.onclick=()=>side(true);ear.onpointerup=e=>{let r=img.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;if(x<0||x>100||y<0||y>100)return;let xs=x.toFixed(1),ys=y.toFixed(1);last=`X ${xs} / Y ${ys}`;xy.textContent=last;dot.style.left=xs+"%";dot.style.top=ys+"%";dot.style.display="block";msg.textContent=""};copy.onclick=async()=>{if(!last){msg.textContent="先に耳をタップしてな🤣";return}try{await navigator.clipboard.writeText(last);msg.textContent="コピーしたで👌"}catch(e){msg.textContent="座標を長押ししてコピーしてな"}};</script></body></html>

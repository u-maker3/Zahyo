<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>耳つぼ座標取り</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff4ef;color:#3e3330;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;text-align:center}.w{max-width:560px;margin:auto;padding:12px}.panel{background:white;border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 3px 14px #0001}select,button{font-size:16px;border:0;border-radius:13px;padding:11px 14px;margin:4px}select{border:1px solid #ddcfca;background:white;min-width:180px}button{background:#8b5870;color:white;font-weight:800}button.off{background:#e7dce1;color:#594750}.ear{position:relative;width:min(94vw,500px);margin:auto;background:white;border-radius:18px;overflow:hidden}.ear img{display:block;width:100%}.dot{position:absolute;width:23px;height:23px;border:4px solid white;border-radius:50%;background:#e94f5f;box-shadow:0 2px 7px #0007;transform:translate(-50%,-50%);display:none;pointer-events:none}#current{font-size:22px;font-weight:900;margin:7px 0}#xy{font-size:24px;font-weight:900}.list{text-align:left;max-height:260px;overflow:auto;font-size:14px;line-height:1.8;padding:4px 10px}.row{border-bottom:1px solid #eee1dc;padding:3px 0}.hint{font-size:12px;color:#7b6964}.copyAll{background:#5f536b}</style></head><body><div class=w><h2>👂 耳つぼ座標取り</h2>
<div class=panel><div class=hint>① ツボを選ぶ</div><select id=point><option>神門</option><option>角窩中</option><option>内生殖器</option><option>交感</option><option>坐骨神経</option><option>股関節</option><option>膝</option><option>踝</option><option>風渓</option><option>腰仙椎</option><option>胸椎</option><option>頸椎</option><option>腕</option><option>肘</option><option>肩</option><option>鎖骨</option><option>後頭</option><option>側頭</option><option>前頭</option><option>大脳皮質下</option><option>顎</option><option>歯</option><option>内耳</option><option>目</option><option>扁桃体</option><option>内分泌</option><option>三焦</option><option>肺</option><option>心</option><option>気管</option><option>副腎</option><option>飢点</option><option>内鼻</option><option>咽頭</option><option>口</option><option>食道</option><option>噴門</option><option>胃</option><option>小腸</option><option>大腸</option><option>腎</option><option>膀胱</option><option>艇角</option><option>肝</option><option>脾</option><option>耳中</option><option>肛門</option><option>耳先</option><option>耳輪</option><option>耳迷根</option></select><div><button id=front>表耳</button><button id=back class=off>裏耳</button></div><div id=current>神門</div><div class=hint>② 耳画像をタップ👇</div></div>
<div class=ear id=ear><img id=img src="ear_base.PNG"><span id=dot class=dot></span></div>
<div class=panel><div id=xy>X --.- / Y --.-</div><button id=save>＋ この座標を記録</button><div id=msg class=hint></div></div>
<div class=panel><b>📋 今回取った座標</b><div id=list class=list>まだなし🤣</div><button id=copyAll class=copyAll>全部まとめてコピー</button><button id=clear class=off>記録を消す</button></div></div>
<script>
const point=document.getElementById("point"),img=document.getElementById("img"),ear=document.getElementById("ear"),dot=document.getElementById("dot"),xy=document.getElementById("xy"),current=document.getElementById("current"),list=document.getElementById("list"),msg=document.getElementById("msg");let side="表耳",last=null,records=[];
point.onchange=()=>{current.textContent=point.value;last=null;xy.textContent="X --.- / Y --.-";dot.style.display="none"};
function setSide(backSide){side=backSide?"裏耳":"表耳";img.src=backSide?"ear_back.PNG":"ear_base.PNG";front.className=backSide?"off":"";back.className=backSide?"":"off";last=null;xy.textContent="X --.- / Y --.-";dot.style.display="none"}
front.onclick=()=>setSide(false);back.onclick=()=>setSide(true);
ear.onpointerup=e=>{let r=img.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;if(x<0||x>100||y<0||y>100)return;last={name:point.value,side,x:+x.toFixed(1),y:+y.toFixed(1)};xy.textContent=`${point.value}：X ${last.x} / Y ${last.y}`;dot.style.left=last.x+"%";dot.style.top=last.y+"%";dot.style.display="block";msg.textContent=""};
function render(){if(!records.length){list.innerHTML="まだなし🤣";return}list.innerHTML=records.map((r,i)=>`<div class="row">${i+1}. ${r.name}（${r.side}） X ${r.x} / Y ${r.y}</div>`).join("")}
save.onclick=()=>{if(!last){msg.textContent="先に耳をタップしてな🤣";return}records.push({...last});render();msg.textContent=`${last.name}、記録したで👌`;let ni=point.selectedIndex+1;if(ni<point.options.length){point.selectedIndex=ni;current.textContent=point.value;last=null;xy.textContent="X --.- / Y --.-";dot.style.display="none"}};
copyAll.onclick=async()=>{if(!records.length){msg.textContent="まだ記録ないで🤣";return}let t=records.map(r=>`${r.name}（${r.side}）：X ${r.x} / Y ${r.y}`).join("\n");try{await navigator.clipboard.writeText(t);msg.textContent="全部コピーしたで👌"}catch(e){msg.textContent="コピーできへん時は一覧をスクショしてな"}};
clear.onclick=()=>{records=[];render();msg.textContent="記録を空にしたで"};
</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>耳つぼ座標取り</title><style>*{box-sizing:border-box}body{margin:0;background:#fff4ef;font-family:-apple-system,sans-serif;text-align:center;color:#3e3330}.w{max-width:560px;margin:auto;padding:12px}.p{background:white;border-radius:18px;padding:12px;margin:10px 0}button,select{font-size:15px;border:0;border-radius:13px;padding:11px;margin:4px}button{background:#8b5870;color:white;font-weight:800}.off{background:#eadfe4;color:#594750}select{border:1px solid #ddd;background:white}.ear{position:relative;width:min(94vw,500px);margin:auto;background:white;border-radius:18px;overflow:hidden}.ear img{display:block;width:100%}.dot{position:absolute;width:23px;height:23px;border:4px solid white;border-radius:50%;background:#e94f5f;transform:translate(-50%,-50%);display:none}#xy{font-size:22px;font-weight:900}#list{text-align:left;max-height:280px;overflow:auto;line-height:1.8;font-size:14px}.small{font-size:12px;color:#786965}</style></head><body><div class=w><h2>👂 耳つぼ座標取り</h2><div class=p><div class=small>① ツボを選ぶ</div><select id=point><option>神門</option><option>角窩中</option><option>内生殖器</option><option>交感</option><option>坐骨神経</option><option>股関節</option><option>膝</option><option>踝</option><option>風渓</option><option>腰仙椎</option><option>胸椎</option><option>頸椎</option><option>腕</option><option>肘</option><option>肩</option><option>鎖骨</option><option>後頭</option><option>側頭</option><option>前頭</option><option>大脳皮質下</option><option>顎</option><option>歯</option><option>内耳</option><option>目</option><option>扁桃体</option><option>内分泌</option><option>三焦</option><option>肺</option><option>心</option><option>気管</option><option>副腎</option><option>飢点</option><option>内鼻</option><option>咽頭</option><option>口</option><option>食道</option><option>噴門</option><option>胃</option><option>小腸</option><option>大腸</option><option>腎</option><option>膀胱</option><option>艇角</option><option>肝</option><option>脾</option><option>耳中</option><option>肛門</option><option>耳先</option><option>耳輪</option><option>耳迷根</option></select><div><button id=a>表耳</button><button id=h class=off>耳珠の裏</button><button id=b class=off>耳の裏側</button></div><b id=name>神門</b><div class=small>② 画像を選んで位置をポチッ👇</div></div><div class=ear id=ear><img id=img src="ear_base.PNG"><span id=dot class=dot></span></div><div class=p><div id=xy>X --.- / Y --.-</div><button id=save>＋ この座標を記録</button><div id=msg class=small></div></div><div class=p><b>📋 今回取った座標</b><div id=list>まだなし🤣</div><button id=copy>全部まとめてコピー</button><button id=clear class=off>記録を消す</button></div></div><script>
const V={base:["表耳","ear_base.PNG"],hidden:["耳珠の裏","ear_hidden.PNG"],back:["耳の裏側","ear_back.PNG"]};let v="base",last=null,rec=[];
function reset(){last=null;xy.textContent="X --.- / Y --.-";dot.style.display="none";msg.textContent=""}
function view(x){v=x;img.src=V[x][1];a.className=x==="base"?"":"off";h.className=x==="hidden"?"":"off";b.className=x==="back"?"":"off";reset()}
a.onclick=()=>view("base");h.onclick=()=>view("hidden");b.onclick=()=>view("back");point.onchange=()=>{name.textContent=point.value;reset()};
ear.onpointerup=e=>{let r=img.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;if(x<0||x>100||y<0||y>100)return;x=+x.toFixed(1);y=+y.toFixed(1);last={n:point.value,s:V[v][0],x,y};xy.textContent=`${point.value}（${V[v][0]}）：X ${x} / Y ${y}`;dot.style.left=x+"%";dot.style.top=y+"%";dot.style.display="block"};
function render(){list.innerHTML=rec.length?rec.map((r,i)=>`${i+1}. ${r.n}（${r.s}） X ${r.x} / Y ${r.y}<br>`).join(""):"まだなし🤣"}
save.onclick=()=>{if(!last){msg.textContent="先に位置をポチッとしてな🤣";return}rec.push({...last});render();msg.textContent=last.n+"、記録したで👌";let i=point.selectedIndex+1;if(i<point.options.length){point.selectedIndex=i;name.textContent=point.value;reset()}};
copy.onclick=async()=>{if(!rec.length)return;let t=rec.map(r=>`${r.n}（${r.s}）：X ${r.x} / Y ${r.y}`).join("\n");try{await navigator.clipboard.writeText(t);msg.textContent="全部コピーしたで👌"}catch(e){msg.textContent="一覧をスクショしてな"}};clear.onclick=()=>{rec=[];render()};
</script></body></html>
